
name: Build JEJO AVIATOR AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract JEJO project
        run: |
          unzip -q JEJO_AVIATOR_AI_Stage2_PhoneBuild.zip -d source

      - name: Build Android APK
        run: |
          cd source/JEJO_AVIATOR_AI
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEJO-AVIATOR-AI-APK
          path: source/JEJO_AVIATOR_AI/app/build/outputs/apk/debug/app-debug.apk
          
